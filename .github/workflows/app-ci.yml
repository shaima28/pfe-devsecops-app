
name: App CI Security

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: [self-hosted, linux, x64]

    permissions:
      contents: read

    steps:
      # 1. Récupération du code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configuration Node.js et cache npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      # 3. Installation des dépendances
      - name: Install dependencies
        run: npm ci

      # 4. Vérification syntaxique
      - name: Check app syntax
        run: node --check src/app.js

      # 5. Tests automatisés
      - name: Run tests
        run: npm test

      # 6. Analyse SonarQube
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # 7. Quality Gate bloquant
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 8. Nettoyage du rapport précédent
      - name: Clear previous Trivy report
        run: rm -f trivy-fs-results.json

      # 9. Scan Trivy filesystem
      - name: Trivy filesystem scan JSON
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs-results.json
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '0'

      # 10. Résumé de sécurité GitHub Actions
      - name: Show Trivy vulnerabilities summary
        if: ${{ always() }}
        shell: bash
        run: |
          echo "## Trivy Filesystem Security Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s trivy-fs-results.json ]; then
            echo "Trivy report unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! jq -e '.Results? | type == "array"' trivy-fs-results.json >/dev/null; then
            echo "Trivy JSON report could not be parsed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-fs-results.json)
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-fs-results.json)

          TOTAL=$((HIGH + CRITICAL))

          echo "| Scan Type | HIGH | CRITICAL | TOTAL |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Filesystem | $HIGH | $CRITICAL | $TOTAL |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$TOTAL" -eq 0 ]; then
            echo "✅ No HIGH or CRITICAL vulnerabilities detected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ HIGH or CRITICAL vulnerabilities detected." >> "$GITHUB_STEP_SUMMARY"
            echo "Review the downloadable Trivy report." >> "$GITHUB_STEP_SUMMARY"
          fi

      # 11. Sauvegarde du rapport Trivy
      - name: Upload Trivy filesystem report
        if: ${{ always() && hashFiles('trivy-fs-results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: trivy-fs-results.json
          retention-days: 14
